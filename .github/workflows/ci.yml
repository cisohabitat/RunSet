name: CI
on: [push, pull_request]
concurrency:
  group: runset-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Planner benchmark smoke
        run: |
          mkdir -p test-results
          npm run benchmark -- --seeds=1 --budget=20 --out=test-results/benchmark-smoke.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quality-failure-details
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  browsers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [chromium, webkit-phone, webkit-ipad, firefox-desktop, offline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use Ubuntu HTTPS package mirror
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-security-mirrors.txt; do
            if [ -f "$apt_source" ]; then
              sudo sed -Ei 's|https?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-runset-downloads
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Provide virtual audio output for browser playback
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=runset
          pactl set-default-sink runset
      - run: npm run build
      - if: matrix.suite == 'chromium'
        run: npm run test:e2e
      - if: matrix.suite != 'chromium' && matrix.suite != 'offline'
        env:
          RUNSET_COMPAT_PROJECT: ${{ matrix.suite }}
        run: npx playwright test --config=playwright.compat.config.ts --project="$RUNSET_COMPAT_PROJECT"
      - if: matrix.suite == 'offline'
        run: npx playwright test --config=playwright.offline.config.ts
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  check:
    if: always()
    needs: [quality, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every quality and browser job
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.browsers.result }}" = success
